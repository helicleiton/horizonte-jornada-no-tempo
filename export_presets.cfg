[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tests/*, docs/*, *.pdf"
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"theme-color\" content=\"#2b1a12\">
<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<style>
html, body, #canvas { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#girar { display: none; position: fixed; inset: 0; z-index: 100; background: #2b1a12; color: #f4c95d; font: bold 20px sans-serif; align-items: center; justify-content: center; text-align: center; padding: 24px; }
@media (orientation: portrait) and (pointer: coarse) { #girar { display: flex; } }
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var aviso = document.createElement('div');
  aviso.id = 'girar';
  aviso.textContent = 'Gire o celular para jogar na horizontal';
  document.body.appendChild(aviso);
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
});
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
