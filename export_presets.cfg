[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"theme-color\" content=\"#2b1a12\">
<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<style>
html, body, #canvas { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#girar { display: none; position: fixed; inset: 0; z-index: 100; background: #2b1a12; color: #f4c95d; font: bold 22px sans-serif; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
#girar .celular { width: 64px; height: 110px; border: 5px solid #f4c95d; border-radius: 12px; margin-bottom: 28px; animation: girar 2.4s ease-in-out infinite; }
#girar p { margin: 8px 0; color: #fff3d6; font: 17px sans-serif; line-height: 1.4; }
@keyframes girar { 0%, 20% { transform: rotate(0deg); } 60%, 100% { transform: rotate(90deg); } }
@media (orientation: portrait) and (pointer: coarse) { #girar { display: flex; } }
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var aviso = document.createElement('div');
  aviso.id = 'girar';
  aviso.innerHTML = '<div class=\"celular\"></div>' +
    '<p><b>Gire o celular para a posição horizontal</b></p>' +
    '<p>Segure o aparelho deitado, como um controle de videogame.</p>';
  document.body.appendChild(aviso);
  try { screen.orientation.lock('landscape').catch(function () {}); } catch (e) {}
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
});
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
